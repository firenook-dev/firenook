<svg xmlns="http://www.w3.org/2000/svg" width="880" height="516" viewBox="0 0 880 516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Firenook against the official Firebase emulator"><title>Firenook against the official Firebase emulator</title><rect width="880" height="516" rx="12" fill="#ffffff"/><rect x="24" y="30" width="12" height="12" rx="2" fill="#a1a1aa"/><text x="42" y="40.5" fill="#6b6b74" font-size="13">Official emulator (firebase-tools 15.22, Java defaults)</text><rect x="410" y="30" width="12" height="12" rx="2" fill="#f23818"/><text x="428" y="40.5" fill="#6b6b74" font-size="13">Firenook 0.2.0-next.6</text><text x="24" y="92" fill="#1d1d20" font-size="14" font-weight="600">Emulator memory, peak</text><rect x="210" y="78" width="470" height="14" rx="3" fill="#f1f1f3"/><rect x="210" y="78" width="470" height="14" rx="3" fill="#a1a1aa"/><text x="690" y="90" fill="#6b6b74" font-size="12.5">19.6 GiB</text><rect x="210" y="98" width="470" height="14" rx="3" fill="#f1f1f3"/><rect x="210" y="98" width="51.9" height="14" rx="3" fill="#f23818"/><text x="271.90184049079755" y="110" fill="#1d1d20" font-size="12.5" font-weight="600">2.16 GiB</text><text x="856" y="101" fill="#1c53cf" font-size="15" font-weight="700" text-anchor="end">89% less</text><line x1="24" x2="856" y1="129" y2="129" stroke="#e4e4e7"/><text x="24" y="156" fill="#1d1d20" font-size="14" font-weight="600">Write, median</text><rect x="210" y="142" width="470" height="14" rx="3" fill="#f1f1f3"/><rect x="210" y="142" width="470" height="14" rx="3" fill="#a1a1aa"/><text x="690" y="154" fill="#6b6b74" font-size="12.5">203 ms</text><rect x="210" y="162" width="470" height="14" rx="3" fill="#f1f1f3"/><rect x="210" y="162" width="12.3" height="14" rx="3" fill="#f23818"/><text x="232.28303747534517" y="174" fill="#1d1d20" font-size="12.5" font-weight="600">5.3 ms</text><text x="856" y="165" fill="#1c53cf" font-size="15" font-weight="700" text-an