="12.5" font-weight="600">0.56 s</text><text x="856" y="357" fill="#1c53cf" font-size="15" font-weight="700" text-anchor="end">80× sooner</text><line x1="24" x2="856" y1="385" y2="385" stroke="#e4e4e7"/><text x="24" y="412" fill="#1d1d20" font-size="14" font-weight="600">Emulator CPU, 2 hours</text><rect x="210" y="398" width="470" height="14" rx="3" fill="#f1f1f3"/><rect x="210" y="398" width="470" height="14" rx="3" fill="#a1a1aa"/><text x="690" y="410" fill="#6b6b74" font-size="12.5">1,597 s</text><rect x="210" y="418" width="470" height="14" rx="3" fill="#f1f1f3"/><rect x="210" y="418" width="183.9" height="14" rx="3" fill="#f23818"/><text x="403.93863494051345" y="430" fill="#1d1d20" font-size="12.5" font-weight="600">625 s</text><text x="856" y="421" fill="#1c53cf" font-size="15" font-weight="700" text-anchor="end">61% less</text><text x="24" y="482" fill="#6b6b74" font-size="12">Memory, latency and CPU: one application, its data and the same two-hour workload, one emulator at a time on one server.</text><text x="24" y="500" fill="#6b6b74" font-size="12">Restarts: Firestore, Auth and Storage on the same data, no application. Lower is better on every row.</text></svg>
