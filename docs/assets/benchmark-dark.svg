<svg xmlns="http://www.w3.org/2000/svg" width="880" height="516" viewBox="0 0 880 516" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Firenook against the official Firebase emulator"><title>Firenook against the official Firebase emulator</title><rect width="880" height="516" rx="12" fill="#0d1117"/><rect x="24" y="30" width="12" height="12" rx="2" fill="#5c5c66"/><text x="42" y="40.5" fill="#9d9da6" font-size="13">Official emulator (firebase-tools 15.22, Java defaults)</text><rect x="410" y="30" width="12" height="12" rx="2" fill="#ff5a36"/><text x="428" y="40.5" fill="#9d9da6" font-size="13">Firenook 0.2.0</text><text x="24" y="92" fill="#e6e6ea" font-size="14" font-weight="600">Emulator memory, peak</text><rect x="210" y="78" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="78" width="470" height="14" rx="3" fill="#5c5c66"/><text x="690" y="90" fill="#9d9da6" font-size="12.5">22.6 GiB</text><rect x="210" y="98" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="98" width="43.9" height="14" rx="3" fill="#ff5a36"/><text x="263.9388568896766" y="110" fill="#e6e6ea" font-size="12.5" font-weight="600">2.11 GiB</text><text x="856" y="101" fill="#7aa7ff" font-size="15" font-weight="700" text-anchor="end">10× less</text><line x1="24" x2="856" y1="129" y2="129" stroke="#262b34"/><text x="24" y="156" fill="#e6e6ea" font-size="14" font-weight="600">Write, median</text><rect x="210" y="142" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="142" width="470" height="14" rx="3" fill="#5c5c66"/><text x="690" y="154" fill="#9d9da6" font-size="12.5">208 ms</text><rect x="210" y="162" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="162" width="11.5" height="14" rx="3" fill="#ff5a36"/><text x="231.51296829971182" y="174" fill="#e6e6ea" font-size="12.5" font-weight="600">5.1 ms</text><text x="856" y="165" fill="#7aa7ff" font-size="15" font-weight="700" text-anchor="end">40× faster</text><line x1="24" x2="856" y1="193" y2="193" stroke="#262b34"/><text x="24" y="220" fill="#e6e6ea" font-size="14" font-weight="600">Listener update, median</text><rect x="210" y="206" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="206" width="470" height="14" rx="3" fill="#5c5c66"/><text x="690" y="218" fill="#9d9da6" font-size="12.5">209 ms</text><rect x="210" y="226" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="226" width="24.7" height="14" rx="3" fill="#ff5a36"/><text x="244.73684210526315" y="238" fill="#e6e6ea" font-size="12.5" font-weight="600">11 ms</text><text x="856" y="229" fill="#7aa7ff" font-size="15" font-weight="700" text-anchor="end">19× faster</text><line x1="24" x2="856" y1="257" y2="257" stroke="#262b34"/><text x="24" y="284" fill="#e6e6ea" font-size="14" font-weight="600">Restart with data kept</text><rect x="210" y="270" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="270" width="470" height="14" rx="3" fill="#5c5c66"/><text x="690" y="282" fill="#9d9da6" font-size="12.5">30.8 s</text><rect x="210" y="290" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="290" width="9" height="14" rx="3" fill="#ff5a36"/><text x="229.00324675324674" y="302" fill="#e6e6ea" font-size="12.5" font-weight="600">0.59 s</text><text x="856" y="293" fill="#7aa7ff" font-size="15" font-weight="700" text-anchor="end">52× sooner</text><line x1="24" x2="856" y1="321" y2="321" stroke="#262b34"/><text x="24" y="348" fill="#e6e6ea" font-size="14" font-weight="600">orderBy, limit 20</text><rect x="210" y="334" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="334" width="470" height="14" rx="3" fill="#5c5c66"/><text x="690" y="346" fill="#9d9da6" font-size="12.5">96.3 ms</text><rect x="210" y="354" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="354" width="58.7" height="14" rx="3" fill="#ff5a36"/><text x="278.6828710917212" y="366" fill="#e6e6ea" font-size="12.5" font-weight="600">12.0 ms</text><text x="856" y="357" fill="#7aa7ff" font-size="15" font-weight="700" text-anchor="end">8× faster</text><line x1="24" x2="856" y1="385" y2="385" stroke="#262b34"/><text x="24" y="412" fill="#e6e6ea" font-size="14" font-weight="600">Emulator CPU, 2 hours</text><rect x="210" y="398" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="398" width="470" height="14" rx="3" fill="#5c5c66"/><text x="690" y="410" fill="#9d9da6" font-size="12.5">1,586 s</text><rect x="210" y="418" width="470" height="14" rx="3" fill="#1b1f27"/><rect x="210" y="418" width="182.5" height="14" rx="3" fill="#ff5a36"/><text x="402.54728877679696" y="430" fill="#e6e6ea" font-size="12.5" font-weight="600">616 s</text><text x="856" y="421" fill="#7aa7ff" font-size="15" font-weight="700" text-anchor="end">61% less</text><text x="24" y="482" fill="#9d9da6" font-size="12">Memory, latency and CPU: one application, its data and the same two-hour workload, one emulator at a time on one server.</text><text x="24" y="500" fill="#9d9da6" font-size="12">Restart and query: Firestore, Auth and Storage on the same data, no application. Lower is better on every row.</text></svg>
