[package]
name = "firenook"
description = "A clean-room local emulator suite grounded in production behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["emulator", "firestore", "development", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
axum.workspace = true
clap.workspace = true
firenook-auth-front = { path = "../auth-front" }
firenook-pubsub-front = { path = "../pubsub-front" }
firenook-capture-proxy = { path = "../capture-proxy" }
firenook-core-store = { path = "../core-store" }
firenook-export-format = { path = "../export-format" }
firenook-extensions = { path = "../extensions" }
firenook-functions-bridge = { path = "../functions-bridge" }
firenook-functions-runtime = { path = "../functions-runtime" }
firenook-grpc-front = { path = "../grpc-front" }
firenook-query-engine = { path = "../query-engine" }
firenook-rest-front = { path = "../rest-front" }
firenook-rules-runtime = { path = "../rules-runtime" }
firenook-suite-runtime = { path = "../suite-runtime" }
firenook-suite-front = { path = "../suite-front" }
firenook-webchannel-front = { path = "../webchannel-front" }
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
