[package]
name = "firenook-suite-front"
description = "Firebase Emulator Hub, UI, and Logging compatibility surfaces for firenook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
firenook-functions-bridge = { path = "../functions-bridge" }
firenook-rules-runtime = { path = "../rules-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs"] }
tower-http.workspace = true

[dev-dependencies]
firenook-core-store = { path = "../core-store" }
firenook-query-engine = { path = "../query-engine" }
firenook-rest-front = { path = "../rest-front" }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
