[package]
name = "firenook-suite-runtime"
description = "Production lifecycle coordinator for the Firenook emulator suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { workspace = true, features = ["ws"] }
futures-util.workspace = true
firenook-auth-front = { path = "../auth-front" }
firenook-core-store = { path = "../core-store" }
firenook-export-format = { path = "../export-format" }
firenook-functions-bridge = { path = "../functions-bridge" }
firenook-extensions = { path = "../extensions" }
firenook-functions-runtime = { path = "../functions-runtime" }
firenook-grpc-front = { path = "../grpc-front" }
firenook-pubsub-front = { path = "../pubsub-front" }
firenook-tasks-front = { path = "../tasks-front" }
firenook-query-engine = { path = "../query-engine" }
firenook-rest-front = { path = "../rest-front" }
firenook-rules-engine = { path = "../rules-engine" }
firenook-rules-runtime = { path = "../rules-runtime" }
firenook-storage-front = { path = "../storage-front" }
firenook-suite-front = { path = "../suite-front" }
firenook-webchannel-front = { path = "../webchannel-front" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "signal"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
tonic.workspace = true
zip.workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
