<!--
  The account picker of a federated sign-in, in the console's own look. It is
  served from the Auth port with no console build behind it, so it cannot use
  Kumo's components: it restates the tokens a Kumo page paints (the journey
  `console/e2e/auth-picker.spec.ts` fails when they part) and the sizes of its
  controls at the console's 14 px root. The faces are the console's, inlined
  so the first paint is already right and nothing is fetched.
-->
<style>
  @font-face { font-family:'InterVariable'; font-style:normal; font-weight:100 900; font-display:block;
    src:url(data:font/woff2;base64,__FIRENOOK_INTER__) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:block;
    src:url(data:font/woff2;base64,__FIRENOOK_PLEX_MONO__) format('woff2'); }

  :root {
    color-scheme:light dark;
    --canvas:oklch(.9875 0 0); --base:#fff; --tint:oklch(.97 0 0); --recessed:oklch(.96 0 0); --control:#fff;
    --line:oklch(.145 0 0 / .1); --hairline:oklch(.935 0 0); --focus:oklch(.15 0 0);
    --text:oklch(.205 0 0); --strong:oklch(.145 0 0); --subtle:oklch(.53 0 0); --placeholder:oklch(.55 0 0);
    --danger:oklch(.505 .213 27.518); --danger-tint:oklch(.936 .032 17.7 / .42); --danger-ring:oklch(.637 .237 25.331);
    --ring:oklch(.49 .2 263); --hover:oklch(0 0 0 / .04); --wordmark:#202124;
    /* The primary button is the cobalt in both modes (the console's theme.css). */
    --cobalt:oklch(.49 .2 263);
  }
  @media (prefers-color-scheme:dark) {
    :root {
      --canvas:oklch(.1 0 0); --base:oklch(.17 0 0); --tint:oklch(.269 0 0); --recessed:oklch(.15 0 0); --control:oklch(.205 0 0);
      --line:oklch(.32 0 0); --hairline:oklch(.269 0 0); --focus:oklch(.935 0 0);
      --text:oklch(.97 0 0); --strong:oklch(.985 0 0); --subtle:oklch(.708 0 0); --placeholder:oklch(.64 0 0);
      --danger:oklch(.704 .191 22.216); --danger-tint:oklch(.429 .176 28.7 / .17); --danger-ring:oklch(.577 .245 27.325);
      --ring:oklch(.65 .16 258); --hover:oklch(1 0 0 / .096); --wordmark:#fff;
    }
  }

  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { height:100%; font:14px/1.45 'InterVariable','Inter',ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-feature-settings:'calt','cv02','cv03','cv04'; }
  body { margin:0; min-height:100%; height:100dvh; display:flex; flex-direction:column; background:var(--canvas); color:var(--text); }
  button,input { font:inherit; color:inherit; margin:0; }
  button { cursor:pointer; }
  .icon { width:1em; height:1em; flex:none; fill:currentColor; }

  /* The console's top bar. */
  header { flex:none; height:48px; display:flex; align-items:center; gap:10px; padding:0 16px; background:var(--base); border-bottom:1px solid var(--line); }
  .logo { display:block; flex:none; height:24px; width:auto; color:var(--wordmark); }
  .slash { flex:none; width:9px; height:18px; color:var(--line); }
  .project { display:flex; align-items:center; gap:7px; min-width:0; }
  .project .icon { font-size:15px; color:var(--subtle); }
  .project span { font:400 13px/1 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .kind { margin-left:auto; flex:none; font-size:12px; color:var(--subtle); white-space:nowrap; }

  main { flex:1; min-height:0; width:100%; max-width:520px; margin:0 auto; padding:20px 20px 14px; display:flex; flex-direction:column; transition:opacity .15s .1s; }
  body[data-busy] main { opacity:.55; pointer-events:none; }
  .view { flex:1; min-height:0; display:flex; flex-direction:column; }
  .title { display:flex; align-items:center; gap:8px; min-height:32px; }
  .title .icon { font-size:19px; color:var(--subtle); }
  h1 { margin:0; font-size:18px; font-weight:600; line-height:1.25; letter-spacing:-.01em; color:var(--strong); overflow-wrap:anywhere; }
  .lede { margin:2px 0 0; color:var(--subtle); }

  /* A framed list, the shape every console panel has. */
  .search { position:relative; margin-top:14px; flex:none; }
  .search .icon { position:absolute; left:10px; top:50%; translate:0 -50%; font-size:14px; color:var(--subtle); pointer-events:none; }
  .search input { padding-left:30px; }
  #accounts { list-style:none; margin:14px 0 0; padding:0; flex:0 1 auto; min-height:64px; overflow-y:auto; background:var(--base) padding-box; border:1px solid var(--line); border-radius:7px; }
  .search + #accounts { margin-top:8px; }
  #accounts:empty { display:none; }
  #accounts li + li { border-top:1px solid var(--hairline); }
  .js-reuse-account { display:flex; align-items:center; gap:11px; width:100%; min-height:58px; padding:8px 12px; border:0; background:none; text-align:left; }
  .js-reuse-account:hover,.js-reuse-account:hover .avatar { background-image:linear-gradient(var(--hover),var(--hover)); }
  .js-reuse-account:focus-visible { outline:2px solid var(--ring); outline-offset:-2px; }
  .avatar { flex:none; width:32px; height:32px; display:grid; place-items:center; overflow:hidden; border-radius:50%; background:var(--tint); font-size:12px; font-weight:500; color:var(--subtle); position:relative; }
  .avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .who { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .who span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .name { font-weight:500; }
  .email { font:400 12px/1.4 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--subtle); }
  .go { font-size:13px; color:var(--subtle); opacity:0; }
  .js-reuse-account:hover .go,.js-reuse-account:focus-visible .go { opacity:1; }
  .none { display:none; margin-top:14px; padding:22px 16px; border-radius:7px; background:var(--recessed); text-align:center; color:var(--subtle); }
  .none strong { display:block; font-weight:500; color:var(--text); }
  #accounts:empty + .none { display:block; }
  #no-match { margin-top:8px; padding:14px 16px; }

  /* Kumo's buttons, at its large size. */
  .actions { flex:none; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:35px; padding:0 14px; border:0; border-radius:7px; font-weight:500; white-space:nowrap;
    background:var(--base); box-shadow:0 0 0 1px var(--line),0 1px 2px 0 rgb(0 0 0 / .05); }
  .btn:hover { background:var(--tint); }
  .btn:focus-visible,.square:focus-visible { outline:2px solid var(--ring); outline-offset:1px; }
  .btn .icon { font-size:15px; }
  .btn.primary { color:#fff; background:linear-gradient(color-mix(in oklch,var(--cobalt),white 15%),var(--cobalt));
    box-shadow:0 0 0 1px color-mix(in oklch,var(--cobalt),black 10%),inset 0 1px 0 0 color-mix(in oklch,var(--cobalt),white 30%),0 1px 2px 0 rgb(0 0 0 / .05); }
  .btn.primary:hover { background:linear-gradient(color-mix(in oklch,var(--cobalt),white 30%),var(--cobalt)); }
  .square { flex:none; width:32px; height:32px; margin-left:-8px; display:grid; place-items:center; padding:0; border:0; border-radius:7px; background:none; }
  .square:hover { background:var(--hover); }
  .square .icon { font-size:16px; color:var(--text); }

  /* Kumo's fields. */
  #main-form .fields { flex:0 1 auto; min-height:0; overflow-y:auto; margin:10px -4px 0; padding:4px; display:grid; gap:12px; }
  label { display:block; margin-bottom:4px; font-weight:500; }
  label small { font-size:12px; font-weight:400; color:var(--subtle); }
  input { display:block; width:100%; height:32px; padding:0 10.5px; border:0; border-radius:7px; background:var(--control); box-shadow:0 0 0 1px var(--line); outline:none; }
  input::placeholder { color:var(--placeholder); opacity:1; }
  input:focus { box-shadow:0 0 0 1.5px color-mix(in oklch,var(--focus) 50%,transparent); }
  input[aria-invalid=true] { box-shadow:0 0 0 1.5px var(--danger-ring); }
  .field-error { margin:4px 0 0; font-size:13px; line-height:1.35; color:var(--danger); }
  .field-error:empty { display:none; }
  .form-actions { grid-template-columns:auto auto; justify-content:space-between; margin-top:14px; }

  [role=alert] { flex:none; margin:12px 0 0; padding:9px 11px; border-radius:7px; background:var(--danger-tint); color:var(--danger); white-space:pre-wrap; overflow-wrap:anywhere; }
  [role=alert]:empty { display:none; }
  footer { flex:none; margin-top:auto; padding-top:14px; font-size:12px; line-height:1.4; color:var(--subtle); }

  /* A finger needs more than a pointer does. */
  @media (pointer:coarse) {
    .js-reuse-account { min-height:62px; }
    .btn,input { height:44px; }
    input { font-size:16px; }
    .square { width:44px; height:44px; margin-left:-14px; }
  }
</style>

4.48Q2308.89 554.06 2291.92 584.39Q2274.96 614.72 2244.88 631.95Q2214.81 649.17 2175.74 649.17ZM2175.74 586.45Q2194.76 586.45 2209.15 577.2Q2223.55 567.94 2231.52 551.75Q2239.49 535.55 2239.49 514.48Q2239.49 493.4 2231.26 477.2Q2223.03 461.01 2208.38 451.76Q2193.73 442.5 2174.71 442.5Q2156.2 442.5 2141.55 451.76Q2126.9 461.01 2118.67 477.2Q2110.45 493.4 2110.45 514.48Q2110.45 535.55 2118.67 551.75Q2126.9 567.94 2141.81 577.2Q2156.72 586.45 2175.74 586.45Z"/><path d="M2340.76 643V283.13H2408.62V481.57L2496.53 385.95H2577.25L2480.08 494.43L2584.96 643H2505.27L2436.9 543.27L2408.62 574.11V643Z"/></g></svg>
  <svg class="slash" viewBox="0 0 12 24" aria-hidden="true"><path d="M9.5 3.5 2.5 20.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
  <div class="project"><svg class="icon" aria-hidden="true"><use href="#i-cube"/></svg><span id="project">__FIRENOOK_PROJECT__</span></div>
  <div class="kind">Auth emulator</div>
</header>
<main>
  <div class="view" id="accounts-list">
    <div class="title"><svg class="icon" aria-hidden="true"><use class="js-provider-icon" href="#i-card"/></svg><h1>Sign in with <span class="js-provider"></span></h1></div>
    <p class="lede">Choose a test account, or make a new one.</p>
    <div class="search" id="search" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="account-filter" type="search" placeholder="Filter accounts" aria-label="Filter accounts" autocomplete="off" spellcheck="false">
    </div>
    <ul id="accounts">__FIRENOOK_ACCOUNT_ITEMS__</ul>
    <div class="none"><strong>No <span class="js-provider"></span> accounts yet</strong>A new one is created when you sign in.</div>
    <div class="none" id="no-match">No account matches.</div>
    <div class="actions">
      <button class="btn primary js-random-account" type="button"><svg class="icon" aria-hidden="true"><use href="#i-dice"/></svg>New random user</button>
      <button class="btn js-new-account" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Add account</button>
    </div>
  </div>
  <form class="view" id="main-form" novalidate hidden>
    <div class="title">
      <button class="square" id="back-button" type="button" aria-label="Back to the accounts"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
      <h1>New <span class="js-provider"></span> account</h1>
    </div>
    <div class="fields">
      <div><label for="email-input">Email</label><input id="email-input" type="email" autocomplete="off" spellcheck="false" aria-describedby="email-error"><p class="field-error" id="email-error"></p></div>
      <div><label for="display-name-input">Display name</label><input id="display-name-input" autocomplete="off"></div>
      <div><label for="screen-name-input">Screen name <small>optional</small></label><input id="screen-name-input" autocomplete="off" spellcheck="false"></div>
      <div><label for="profile-photo-input">Photo URL <small>optional</small></label><input id="profile-photo-input" type="url" autocomplete="off" spellcheck="false"></div>
    </div>
    <div class="actions form-actions">
      <button class="btn" id="autogen-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-dice"/></svg>Fill in random</button>
      <button class="btn primary" id="sign-in" type="submit">Sign in</button>
    </div>
  </form>
  <p id="error" role="alert"></p>
  <footer>Local test accounts only. No password is requested or sent.</footer>
</main>
<script>
(() => {
  'use strict';
  const query = new URLSearchParams(location.search);
  const apiKey = query.get('apiKey'), appName = query.get('appName');
  const provider = query.get('providerId'), kind = query.get('authType');
  const storageKey = apiKey + ':' + appName;
  const form = document.getElementById('main-form');
  const list = document.getElementById('accounts-list');
  const error = message => { document.getElementById('error').textContent = message; document.body.removeAttribute('data-busy'); };
  const random = limit => crypto.getRandomValues(new Uint32Array(1))[0] % limit;
  // A random v4 UUID. `crypto.randomUUID` exists only in a secure context, and this
  // page is not one when the emulator is reached over HTTP by a LAN address or a
  // container name.
  const uuid = () => {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = bytes[6] & 0x0f | 0x40; bytes[8] = bytes[8] & 0x3f | 0x80;
    const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
    return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join('-');
  };

  // A provider's name and glyph, as the console's Auth pages write them.
  const PROVIDERS = {'google.com':['Google','google'],'apple.com':['Apple','apple'],'github.com':['GitHub','github'],
    'facebook.com':['Facebook','facebook'],'twitter.com':['X (Twitter)','x'],'microsoft.com':['Microsoft','windows'],
    'yahoo.com':['Yahoo','card'],'gc.apple.com':['Game Center','game'],'playgames.google.com':['Play Games','game']};
  const [label, glyph] = PROVIDERS[provider] ?? [provider?.startsWith('saml.') ? 'SAML (' + provider + ')' : provider?.startsWith('oidc.') ? 'OIDC (' + provider + ')' : provider, 'card'];
  for (const name of document.querySelectorAll('.js-provider')) name.textContent = label;
  document.querySelector('.js-provider-icon').setAttribute('href', '#i-' + glyph);
  document.title = 'Sign in with ' + label + ' · Firenook Auth Emulator';
  if (query.get('tid')) document.getElementById('project').textContent += ' · ' + query.get('tid');

  function complete(claims) {
    if (!appName) return error('Missing appName for browser sign-in.');
    document.getElementById('error').textContent = '';
    document.body.dataset.busy = '';
    const response = new URL(location.pathname, location.origin);
    response.searchParams.set('providerId', provider);
    response.searchParams.set('id_token', JSON.stringify(claims));
    const authEvent = {type:kind, eventId:query.get('eventId'), urlResponse:response.href,
      sessionId:'ValueNotUsedByAuthEmulator', postBody:'', tenantId:query.get('tid'), error:null};
    if (kind === 'signInViaPopup' || kind === 'linkViaPopup' || kind === 'reauthViaPopup') {
      // The SDK listens through its Auth-origin iframe, not the app's window.
      const opener = window.opener;
      if (opener) for (let index = 0; index < opener.frames.length; index++) {
        const frame = opener.frames[index];
        let frameUrl;
        // Reading another origin's frame throws: those are the app's own frames, not relays.
        try { frameUrl = new URL(frame.location.href); } catch { continue; }
        if (frameUrl.origin !== location.origin || frameUrl.pathname !== '/emulator/auth/iframe') continue;
        if (frameUrl.searchParams.get('apiKey') !== apiKey || frameUrl.searchParams.get('appName') !== appName) continue;
        frame.postMessage({eventType:'sendAuthEvent',eventId:uuid(),data:{storageKey,authEvent}}, location.origin);
        return;
      }
      return error('Cannot find the matching Firebase Auth iframe. Close this window and retry sign-in.');
    }
    if (kind === 'signInViaRedirect' || kind === 'linkViaRedirect' || kind === 'reauthViaRedirect') {
      try {
        const destination = new URL(query.get('redirectUrl'));
        if (!['http:','https:'].includes(destination.protocol)) throw new Error('Expected an HTTP(S) redirect URL.');
        sessionStorage.setItem('firebase:redirectEvent:' + storageKey, JSON.stringify(authEvent));
        location.assign(destination.href);
      } catch (failure) { error(failure.message); }
      return;
    }
    error('Unsupported browser authType. Start sign-in from the Firebase JS SDK.');
  }

  // The accounts are rendered by the server in the official picker's shape:
  // one `.js-reuse-account` per account with its fake IdP claims in
  // `data-id-token`, URL-encoded.
  const buttons = [...document.querySelectorAll('.js-reuse-account')];
  for (const button of buttons) {
    button.onclick = () => complete(JSON.parse(decodeURIComponent(button.dataset.idToken)));
  }
  // A photo that does not load leaves the initials under it.
  for (const photo of document.querySelectorAll('.avatar img')) photo.onerror = () => photo.remove();

  // A long list is searched: Enter takes the first account left.
  const filter = document.getElementById('account-filter');
  document.getElementById('search').hidden = buttons.length < 8;
  filter.oninput = () => {
    const words = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
    let left = 0;
    for (const button of buttons) {
      const text = button.textContent.toLowerCase();
      const shown = words.every(word => text.includes(word));
      button.parentElement.hidden = !shown;
      if (shown) left++;
    }
    document.getElementById('accounts').hidden = !left;
    document.getElementById('no-match').style.display = left ? '' : 'block';
  };
  filter.onkeydown = event => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    buttons.find(button => !button.parentElement.hidden)?.click();
  };

  // Someone to sign in as, from the names the console's sample users take.
  const FIRST = ['Ada','Grace','Alan','Katherine','Edsger','Barbara','Donald','Frances','Hedy','John','Margaret','Radia','Annie','Ken','Dennis','Mary','Claude','Evelyn','Tim','Lynn'];
  const LAST = ['Lovelace','Hopper','Turing','Johnson','Dijkstra','Liskov','Knuth','Allen','Lamarr','McCarthy','Hamilton','Perlman','Easley','Thompson','Ritchie','Keller','Shannon','Boyd','Berners','Conway'];
  const someone = () => {
    const first = FIRST[random(FIRST.length)], last = LAST[random(LAST.length)];
    const handle = (first + '.' + last).toLowerCase();
    return {name:first + ' ' + last, screenName:handle.replace('.', '_'), email:handle + '.' + (10000 + random(90000)) + '@example.test'};
  };
  const claimsFor = (fields) => {
    const claims = {sub:uuid(),iss:'',aud:'',exp:0,iat:0,email_verified:true,email:fields.email};
    if (fields.name) claims.name = fields.name;
    if (fields.screenName) claims.screen_name = fields.screenName;
    if (fields.photo) claims.picture = fields.photo;
    return claims;
  };
  document.querySelector('.js-random-account').onclick = () => complete(claimsFor(someone()));

  const showForm = visible => {
    form.hidden = !visible;
    list.hidden = visible;
    document.getElementById('error').textContent = '';
    (visible ? document.getElementById('email-input') : document.querySelector('.js-new-account')).focus();
  };
  document.querySelector('.js-new-account').onclick = () => showForm(true);
  document.getElementById('back-button').onclick = () => showForm(false);
  form.onkeydown = event => { if (event.key === 'Escape') showForm(false); };

  const email = document.getElementById('email-input');
  const emailError = message => {
    document.getElementById('email-error').textContent = message;
    email.setAttribute('aria-invalid', String(!!message));
  };
  email.oninput = () => emailError('');
  document.getElementById('autogen-button').onclick = () => {
    const made = someone();
    email.value = made.email;
    document.getElementById('display-name-input').value = made.name;
    document.getElementById('screen-name-input').value = made.screenName;
    emailError('');
  };
  form.onsubmit = event => {
    event.preventDefault();
    const value = email.value.trim();
    // What the official form says of an email it will not take.
    if (!value || !value.includes('@')) {
      emailError(value ? 'Missing "@"' : 'Email required');
      return email.focus();
    }
    complete(claimsFor({email:value, name:document.getElementById('display-name-input').value,
      screenName:document.getElementById('screen-name-input').value, photo:document.getElementById('profile-photo-input').value}));
  };
})();
</script>
</html>
