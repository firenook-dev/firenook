[package]
name = "fireside-functions-runtime"
description = "Owned Cloud Functions runtime for the fireside emulator suite: discovery, Node workers, routing, event delivery and Extensions loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
axum.workspace = true
base64.workspace = true
fireside-functions-bridge = { path = "../functions-bridge" }
futures-util.workspace = true
http-body-util = "0.1.5"
notify = "8"
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "signal"] }
tokio-util.workspace = true

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
