# When Cargo (1.100 or later) picks a new dependency version, it leaves out
# versions published less than a week ago, so a hijacked release has time to be
# found and yanked first. Versions already in Cargo.lock are kept. For one
# urgent update: CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>
[registry]
global-min-publish-age = "7 days"
