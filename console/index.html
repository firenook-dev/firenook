<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Firenook's icons, from the brand's favicon set. Written from the
         root: Vite puts the console's base path in front, in development and
         in the build alike (%BASE_URL% would get it twice in development). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <title>Firenook console</title>
  </head>
  <body>
    <div id="root" class="isolate"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
