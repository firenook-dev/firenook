name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build the console the engine embeds
        run: |
          npm install --global npm@12.0.2
          node packaging/build-console.mjs
      - name: Install latest stable Rust components
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --all-targets --all-features
      - name: Verify the committed Console API bindings match the Rust types
        run: git diff --exit-code -- console/src/api/generated

  console:
    name: Console checks and browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install current npm and the pinned console dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci --prefix console
      - name: Type-check, lint, format, unit tests, build and budget
        run: |
          npm run check --prefix console
          npm run lint --prefix console
          npm run format:check --prefix console
          npm run test --prefix console
          npm run build --prefix console
          npm run budget --prefix console
      - name: Install latest stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: Build the engine the browser journey runs against
        run: cargo build --locked --bin firenook
      - name: Provision the pinned Emulator UI asset the UI port still requires
        run: node -e 'import("./packages/cli/src/assets.mjs").then(m => m.setupAssets())'
      - name: Install Chromium for Playwright
        working-directory: console
        run: npx playwright install --with-deps chromium
      - name: Run the console browser journey against the real engine
        working-directory: console
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: console-playwright-report
          path: |
            console/playwright-report
            console/test-results

  public-contracts:
    name: Public fixture and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Verify the repository stays consumer-independent
        # The private term list is a repository secret; fork pull requests
        # run the built-in patterns only and the merge run applies the full
        # policy. Matched terms are never printed.
        env:
          PUBLIC_POLICY_JSON: ${{ secrets.PUBLIC_POLICY_JSON }}
        run: |
          if [ -n "$PUBLIC_POLICY_JSON" ]; then
            printf '%s' "$PUBLIC_POLICY_JSON" > "$RUNNER_TEMP/public-policy.json"
            export FIRENOOK_PUBLIC_POLICY="$RUNNER_TEMP/public-policy.json"
          fi
          range="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
          node scripts/check-independence.mjs --commits "$range"
      - name: Install current npm
        run: npm install --global npm@12.0.2
      - name: Install pinned harness dependencies
        run: npm ci --prefix conformance
      - name: Type-check harness
        run: npm run check --prefix conformance
      - name: Verify synthetic oracle fixture integrity
        run: |
          npm run test:storage-fixtures --prefix conformance
          npm run test:storage-rules-fixtures --prefix conformance
          npm run test:functions-runtime-fixtures --prefix conformance
          npm run test:auth-fixtures --prefix conformance
          npm run test:pubsub-fixtures --prefix conformance
          npm run test:tasks-fixtures --prefix conformance
          npm run test:rules:query-fixtures --prefix conformance
          npm run test:serialization:fixtures --prefix conformance
          npm run test:developer-tools-fixtures --prefix conformance
          node --test conformance/test/developer-overhead-receipt.test.mjs
          node --test conformance/test/functions-readiness-fixture.test.mjs
          node --test conformance/test/functions-readiness-receipts.test.mjs
          node --test conformance/test/rest-read-options-fixture.test.mjs
          node --test conformance/test/rule-bindings-fixture.test.mjs
          node --test conformance/test/functions-topic-reload-fixture.test.mjs
          node --test conformance/test/lifecycle-receipts.test.mjs
          node --test conformance/test/rest-encoding-profile.test.mjs
          node --test conformance/test/native-baseline-repeat.test.mjs
          node --test conformance/test/storage-profile-receipts.test.mjs
      - name: Verify package and publication safety contracts
        run: node --test packaging/*.test.mjs

  conformance:
    name: Differential harness
    runs-on: ubuntu-latest
    # The Auth and Pub/Sub oracle replays (Phases I and J) brought this job to
    # 16-18 minutes on a typical runner; 20 was cancelling it on slow ones.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Install current npm
        run: npm install --global npm@12.0.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 26
      - name: Install latest stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: Install pinned harness dependencies
        run: npm ci --prefix conformance
      - name: Type-check harness
        run: npm run check --prefix conformance
      - name: Run harness unit tests
        run: npm test --prefix conformance
      - name: Verify real Auth popup and redirect against the official fixture
        run: node --test conformance/test/auth-popup.test.mjs
      - name: Replay REST read options in memory and disk/WAL
        run: node --test conformance/test/rest-read-options-replay.test.mjs
      - name: Verify native coverage reports in a real browser
        run: node --test conformance/test/developer-coverage-browser.test.mjs
      - name: Prepare pinned official developer UI compatibility peers
        run: |
          npm install --prefix "$RUNNER_TEMP/firenook-devtools" --ignore-scripts --no-audit --no-fund firebase-tools@15.22.0 firebase-functions@7.2.5 firebase-admin@13.10.0
          node conformance/src/developer-tools/prepare-ui.mjs "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-tools"
      - name: Verify complete synthetic suite data controls, diagnostics and shutdown
        run: >-
          node conformance/src/developer-tools/verify-native-ui.mjs
          target/debug/firenook
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-tools"
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-functions"
          "$HOME/.cache/firebase/emulators"
          "$RUNNER_TEMP/firenook-developer-ui-evidence"
          --topic-reload
      - name: Verify retained native state and cleanup after failed export
        run: >-
          node conformance/src/suite/verify-export-failure.mjs
          target/debug/firenook
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-tools"
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-functions"
          "$HOME/.cache/firebase/emulators"
          "$RUNNER_TEMP/firenook-export-failure-evidence"
      # The last engine published before the rename: the upgrade check below resumes
      # its native state with the current engine (store files are adopted in place).
      - name: Install exact previous native engine without package scripts
        run: npm install --prefix "$RUNNER_TEMP/firenook-previous-engine" --ignore-scripts --no-audit --no-fund @fireside-dev/linux-x64@0.1.0-next.3
      - name: Verify crash during incomplete export staging and native recovery
        run: >-
          node conformance/src/suite/verify-export-failure.mjs
          target/debug/firenook "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-tools"
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-functions"
          "$HOME/.cache/firebase/emulators" "$RUNNER_TEMP/firenook-interrupted-export-evidence"
          --interrupt-export
      - name: Verify real ENOSPC on isolated export and native working filesystems
        run: |
          for mode in export working; do
            bash conformance/src/suite/with-fault-filesystem.sh \
              target/debug/firenook "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-tools" \
              "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-functions" \
              "$HOME/.cache/firebase/emulators" "$RUNNER_TEMP/firenook-enospc-$mode-evidence" "$mode"
          done
      - name: Verify previous native upgrade and portable rollback
        run: |
          node conformance/node_modules/playwright/cli.js install --with-deps chromium
          ln -s "$GITHUB_WORKSPACE/conformance/node_modules/firebase" "$RUNNER_TEMP/firenook-devtools/node_modules/firebase"
          node conformance/src/suite/verify-native-resume.mjs \
            target/debug/firenook "$RUNNER_TEMP/firenook-devtools" \
            "$HOME/.cache/firebase/emulators" "$RUNNER_TEMP/firenook-native-upgrade-evidence" \
            "$RUNNER_TEMP/firenook-previous-engine/node_modules/@fireside-dev/linux-x64/bin/fireside"
      - name: Replay the Functions runtime and Extensions oracle corpus
        env:
          FIREBASE_FUNCTIONS_7_2_ROOT: ${{ runner.temp }}/firenook-devtools/node_modules/firebase-functions
          FIRENOOK_OFFLINE: "1"
        run: |
          NODE24="$(command -v node)" npm run replay:functions:runtime --prefix conformance -- \
            --binary ../target/debug/firenook \
            --profiles main,v1-blocking,inspect,ext-missing-param \
            --output "$RUNNER_TEMP/firenook-functions-runtime-replay.json"
      - name: Replay the Cloud Tasks oracle corpus against the suite
        env:
          FIREBASE_FUNCTIONS_7_2_ROOT: ${{ runner.temp }}/firenook-devtools/node_modules/firebase-functions
          FIRENOOK_OFFLINE: "1"
        run: |
          NODE24="$(command -v node)" npm run replay:functions:runtime --prefix conformance -- \
            --binary ../target/debug/firenook \
            --profiles tasks \
            --fixture fixtures/tasks-v1/emulator-programs.json \
            --output "$RUNNER_TEMP/firenook-tasks-replay.json"
      - name: Replay the Auth oracle corpus against the standalone Auth service
        run: |
          npm run replay:auth --prefix conformance -- \
            --binary ../target/debug/firenook \
            --output "$RUNNER_TEMP/firenook-auth-replay.json"
      - name: Replay the Pub/Sub oracle corpus over gRPC and HTTP/JSON
        run: |
          npm run replay:pubsub --prefix conformance -- \
            --binary ../target/debug/firenook \
            --output "$RUNNER_TEMP/firenook-pubsub-replay.json"
      - name: Verify the pinned Pub/Sub client library against Firenook
        run: |
          npm run verify:pubsub:client --prefix conformance -- \
            --binary ../target/debug/firenook \
            --output "$RUNNER_TEMP/firenook-pubsub-client.json"
      - name: Verify suite start without Java on PATH
        run: >-
          node conformance/src/suite/verify-no-java.mjs
          target/debug/firenook
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-tools"
          "$RUNNER_TEMP/firenook-devtools/node_modules/firebase-functions"
          "$HOME/.cache/firebase/emulators"
          "$RUNNER_TEMP/firenook-no-java-evidence"
      - name: Preserve synthetic developer UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-developer-ui
          path: |
            ${{ runner.temp }}/firenook-developer-ui-evidence/result.json
            ${{ runner.temp }}/firenook-export-failure-evidence/result.json
            ${{ runner.temp }}/firenook-interrupted-export-evidence/result.json
            ${{ runner.temp }}/firenook-interrupted-export-evidence/*.log
            ${{ runner.temp }}/firenook-enospc-*-evidence/result.json
            ${{ runner.temp }}/firenook-enospc-*-evidence/*.log
            ${{ runner.temp }}/firenook-enospc-*-evidence/fault.img
            ${{ runner.temp }}/firenook-native-upgrade-evidence/result.json
            ${{ runner.temp }}/firenook-native-upgrade-evidence/failure.json
            ${{ runner.temp }}/firenook-developer-ui-evidence/failure.json
            ${{ runner.temp }}/firenook-developer-ui-evidence/browser-failure.json
            ${{ runner.temp }}/firenook-developer-ui-evidence/*.png
            ${{ runner.temp }}/firenook-functions-runtime-replay.json
            ${{ runner.temp }}/firenook-auth-replay.json
            ${{ runner.temp }}/firenook-pubsub-replay.json
            ${{ runner.temp }}/firenook-pubsub-client.json
            ${{ runner.temp }}/firenook-no-java-evidence/result.json
            ${{ runner.temp }}/firenook-no-java-evidence/suite.log
          if-no-files-found: ignore
      - name: Verify query rules oracle fixtures
        run: npm run test:rules:query-fixtures --prefix conformance
      - name: Verify document-map serialization oracle fixtures
        run: npm run test:serialization:fixtures --prefix conformance
      - name: Replay document-map serialization in memory and disk/WAL
        run: npm run test:serialization:replay --prefix conformance
      - name: Replay query rules through native and browser transports
        run: npm run test:rules:query-replay --prefix conformance
      - name: Run WebChannel browser demo
        run: npm run test:webchannel:browser --prefix conformance
      - name: Run WebChannel browser demo in disk/WAL mode
        run: npm run test:webchannel:browser:disk --prefix conformance
      - name: Run Firenook conformance
        run: npm run test:firenook --prefix conformance
      - name: Run Firenook disk-mode conformance
        run: npm run test:firenook:disk --prefix conformance
      - name: Run Firenook strict-index conformance
        run: npm run test:firenook:strict --prefix conformance
      - name: Run Firenook Enterprise pipeline conformance
        run: npm run test:firenook:enterprise --prefix conformance
      - name: Run Firenook Enterprise pipeline conformance in disk mode
        run: npm run test:firenook:enterprise:disk --prefix conformance
      - name: Prove disk recovery across SIGKILL
        if: runner.os != 'Windows'
        run: npm run test:firenook-disk-recovery --prefix conformance
      - name: Import an official export into Firenook
        run: npm run test:firenook-import --prefix conformance
      - name: Download and test the official Java emulator
        run: npm run test:official --prefix conformance
      - name: Test the official Java emulator in Enterprise mode
        run: npm run test:official:enterprise --prefix conformance
      - name: Re-import a Firenook-written export into Java
        run: npm run test:official-export-import --prefix conformance
      - name: Export through Firenook and import into Java
        run: npm run test:firenook-export-java-import --prefix conformance

  firebase-js-sdk:
    name: Firebase JS SDK browser integration (${{ matrix.server_mode }}, client ${{ matrix.client_persistence }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        server_mode: [memory, disk-wal]
        client_persistence: [memory, persistence]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firebase/firebase-js-sdk
          ref: 6cde0c0230b4c1da01d4a058333daa7663322fd1
          path: .phase2/firebase-js-sdk
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: yarn
          cache-dependency-path: .phase2/firebase-js-sdk/yarn.lock
      - name: Install pinned npm and Yarn
        run: npm install --global npm@12.0.2 yarn@1.22.22
      - name: Install latest stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: Install Firenook conformance dependencies
        run: npm ci --prefix conformance
      - name: Install pinned Firebase JS SDK dependencies
        working-directory: .phase2/firebase-js-sdk
        run: yarn install --frozen-lockfile
      - name: Run Google's Firestore browser integration bootstrap
        run: >-
          npm run test:webchannel:firebase-js-sdk --prefix conformance --
          --sdk-dir "${{ github.workspace }}/.phase2/firebase-js-sdk"
          --client-persistence "${{ matrix.client_persistence }}"
          ${{ matrix.server_mode == 'disk-wal' && '--disk' || '' }}
