name: Real SDK clients

# The same FlutterFire app against Firenook and firebase-tools on each platform,
# failing on any difference (conformance/flutter-check). It builds and boots real
# clients, so it runs weekly, by hand, and on a pull request that changes the
# check or the pinned engine, not on every pull request, and it is separate from
# the release job. A release runs it on the pinned commit on main first (see
# packaging/PUBLISHING.md); its pull request, which only adds the release's own
# fields to that commit, then does not run it again (packaging/pinned-evidence.mjs).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - packages/cli/release.json
      - conformance/flutter-check/**
      - .github/workflows/sdk-clients.yml

permissions:
  contents: read

concurrency:
  group: sdk-clients-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  scope:
    name: Tested at the pinned engine
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      covered: ${{ steps.check.outputs.covered }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(node packaging/pinned-evidence.mjs --workflow sdk-clients.yml)" = covered ]; then
            echo covered=true >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.platform }}${{ matrix.kept && ' (kept cache)' || '' }}
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.covered != 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            runner: ubuntu-latest
            flutter: linux/flutter_linux
            archive: tar.xz
          - platform: ios
            runner: macos-latest
            flutter: macos/flutter_macos_arm64
            archive: zip
          # The kept-cache runs on a second Mac at the same time: each
          # takes 15-18 minutes, and one after the other they made iOS the
          # whole check's longest job (40 minutes). The kept-cache run starts
          # from a fresh install of its own, so it needs nothing from the other.
          - platform: ios
            kept: true
            runner: macos-latest
            flutter: macos/flutter_macos_arm64
            archive: zip
          # Pinned until the emulator has been run on the Ubuntu 26.04 image.
          - platform: android
            runner: ubuntu-24.04
            flutter: linux/flutter_linux
            archive: tar.xz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install latest stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build the engine
        run: cargo build --locked --bin firenook
      - name: Install firebase-tools at the pinned version
        run: npm ci --prefix conformance --no-audit --no-fund
      - name: Install Flutter
        run: |
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/${{ matrix.flutter }}_${FLUTTER_VERSION}-stable.${{ matrix.archive }}"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/flutter.${{ matrix.archive }}" "$url"
          if [ "${{ matrix.archive }}" = zip ]; then
            unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          else
            tar -xJf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Start an Android emulator
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install platform-tools emulator "system-images;android-35;google_apis;x86_64" > /dev/null
          # avdmanager and the emulator can disagree on where AVDs live; name one place for both.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name check --package "system-images;android-35;google_apis;x86_64"
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx check; then
            echo "::error::The emulator does not see the AVD avdmanager created"
            exit 1
          fi
          df -h "$HOME" "$RUNNER_TEMP"
          "$ANDROID_HOME/emulator/emulator" -accel-check
          # The emulator's log goes out with the results.
          mkdir -p "$RUNNER_TEMP/results"
          log="$RUNNER_TEMP/results/emulator.log"
          nohup "$ANDROID_HOME/emulator/emulator" -avd check -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect > "$log" 2>&1 &
          emulator=$!
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          adb="$ANDROID_HOME/platform-tools/adb"
          # An emulator that exits or stalls ends this step with its log, not the job at its time limit.
          deadline=$((SECONDS + 900))
          until [ "$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = 1 ]; do
            if ! kill -0 "$emulator" 2> /dev/null; then
              echo "::error::The emulator exited before it booted"
              tail -n 100 "$log"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The emulator did not boot within 15 minutes"
              "$adb" devices
              tail -n 100 "$log"
              exit 1
            fi
            sleep 5
          done
          echo "Booted after $SECONDS s"
      - name: Run the same app against Firenook and firebase-tools
        if: ${{ !matrix.kept }}
        run: node conformance/flutter-check/check.mjs --platform ${{ matrix.platform }} --out "$RUNNER_TEMP/results"
      - name: Run them on a kept cache, as a device moving from firebase-tools to Firenook
        if: ${{ !cancelled() && (matrix.kept || matrix.platform == 'android') }}
        run: node conformance/flutter-check/check.mjs --platform ${{ matrix.platform }} --keep-cache --out "$RUNNER_TEMP/results/kept-cache"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-clients-${{ matrix.platform }}${{ matrix.kept && '-kept-cache' || '' }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 14
