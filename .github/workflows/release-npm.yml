name: Reviewed npm release

# No PR, push or automatic tag publishing. The release owner creates the
# reviewed tag, then dispatches this workflow on main with that exact tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed npm-vVERSION tag (unchanged original tag for recovery)'
        required: true
        type: string
      resume:
        description: 'Use the reviewed version-specific recovery receipt and original artifacts; no builds'
        required: false
        default: false
        type: boolean
      latest:
        description: 'Publish the CLI to latest instead of next (native packages stay on next; the CLI''s next stays on the previous release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source_run: ${{ steps.contract.outputs.source_run }}
      artifact_ids: ${{ steps.contract.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Validate exact release tag and protected environment
        id: contract
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RESUME: ${{ inputs.resume }}
          RELEASE_LATEST: ${{ inputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test packaging/*.test.mjs
          node packaging/check-release.mjs --release
          gh api repos/${{ github.repository }} --jq '.private' | grep -qx false
          gh api repos/${{ github.repository }}/environments/npm-release --jq 'any(.protection_rules[]; .type == "required_reviewers")' | grep -qx true

  quality:
    needs: authorize
    if: ${{ !inputs.resume }}
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: authorize
    if: ${{ !inputs.resume }}
    uses: ./.github/workflows/packages.yml

  publish:
    needs: [authorize, quality, artifacts]
    if: ${{ always() && needs.authorize.result == 'success' && (inputs.resume || (needs.quality.result == 'success' && needs.artifacts.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.source_run || github.run_id }}
          artifact-ids: ${{ needs.authorize.outputs.artifact_ids }}
      - name: Publish verified platform packages, then CLI, through OIDC
        env:
          RELEASE_RESUME: ${{ inputs.resume }}
          RELEASE_LATEST: ${{ inputs.latest }}
        run: node packaging/publish-packages.mjs dist --publish

  container:
    needs: [authorize, publish]
    # The image installs the version this run just published, so it follows
    # the publish, behind the same approval; it can also be dispatched alone.
    if: ${{ always() && needs.authorize.result == 'success' && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      version: ${{ inputs.tag }}
      latest: ${{ inputs.latest }}

  mcp-registry:
    needs: [authorize, publish]
    # Once npm has the version, behind the same approval: the registry reads
    # `mcpName` from that exact npm version. Stable versions only; GitHub OIDC,
    # no stored token.
    if: ${{ always() && needs.authorize.result == 'success' && needs.publish.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ inputs.tag }}

  release-notes:
    needs: [authorize, publish]
    # A resume skips the build jobs, and a job skips whenever a job upstream
    # was skipped unless it says otherwise: the notes follow the publish.
    if: ${{ always() && needs.authorize.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.source_run || github.run_id }}
          artifact-ids: ${{ needs.authorize.outputs.artifact_ids }}
      # What the conformance replays proved on this release's source: every
      # recorded answer and what was checked, for firenook.dev/compatibility.
      # A release whose quality gates were covered by the pinned engine's CI
      # run on main (packaging/pinned-evidence.mjs) has no report of its own:
      # that run's is the report of the same source.
      - name: Find the conformance report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.authorize.outputs.source_run || github.run_id }}
        run: |
          node packaging/conformance-report-run.mjs "$SOURCE_RUN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: conformance-ledger-report
          path: conformance-report
          github-token: ${{ github.token }}
          run-id: ${{ steps.report.outputs.run }}
      # Drafted while its files go up, then published: the approval before
      # the npm publication was the review of what it carries. A run that
      # published the CLI to `latest` makes it the repository's latest
      # release; a preview is a prerelease.
      - name: Attach the artifacts and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_RUN: ${{ needs.authorize.outputs.source_run || github.run_id }}
          GITHUB_RELEASE_LATEST: ${{ inputs.latest && 'true' || 'false' }}
          REPORT_RUN: ${{ steps.report.outputs.run }}
        run: |
          VERSION="${RELEASE_TAG#npm-v}"
          # This version's section of the changelog, not the whole file.
          node packaging/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Firenook $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          mkdir release-receipts
          for PLATFORM in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            for RECEIPT in npm-smoke bun-smoke suite-smoke; do
              cp "dist/$PLATFORM/$RECEIPT.json" "release-receipts/$PLATFORM-$RECEIPT.json"
            done
          done
          gh release upload "$RELEASE_TAG" "dist/linux-x64/firenook-$VERSION.tgz" dist/*/firenook-cli-linux-*.tgz dist/*/firenook-cli-darwin-*.tgz dist/*/firenook-cli-win32-*.tgz dist/*/*-manifest.json release-receipts/*.json
          node -e 'const fs=require("node:fs");fs.writeFileSync("release-source.json",JSON.stringify({tag:process.env.RELEASE_TAG,artifactBuildRun:process.env.SOURCE_RUN,publicationRun:process.env.GITHUB_RUN_ID,publicationCommit:process.env.GITHUB_SHA,rebuiltDuringRecovery:false,conformanceReportRun:process.env.REPORT_RUN},null,2));'
          gh release upload "$RELEASE_TAG" release-source.json
          cp conformance-report/cases.json conformance-cases.json
          cp conformance-report/verify.json conformance-verify.json
          gh release upload "$RELEASE_TAG" conformance-cases.json conformance-verify.json
          case "$VERSION" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$RELEASE_TAG" --draft=false --latest="$GITHUB_RELEASE_LATEST" ;;
          esac
