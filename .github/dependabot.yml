version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /conformance
    schedule:
      interval: daily
    ignore:
      # The bloom-filter fixture runs this exact SDK build as its oracle and pins
      # its version and hash; moving it means re-pinning that fixture by hand.
      - dependency-name: "firebase"
    groups:
      conformance-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
